<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sardine</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1d4ed8);
        color: white;
      }
      .card {
        text-align: center;
        padding: 2rem 3rem;
        border-radius: 16px;
        background: rgba(255,255,255,0.08);
        box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      }
      h1 {
        margin-bottom: 0.5rem;
      }
      p {
        margin: 0;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sardine</h1>
      <p>Your repository is ready.</p>
    </div>
  </body>
</html>
